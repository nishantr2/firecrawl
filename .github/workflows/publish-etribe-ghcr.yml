name: Publish eTribe Firecrawl images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/playwright-service-ts/**"
      - "apps/nuq-postgres/**"
      - ".github/workflows/publish-etribe-ghcr.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: etribe-firecrawl-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firecrawl
            context: ./apps/api
          - image: firecrawl-playwright
            context: ./apps/playwright-service-ts
          - image: firecrawl-nuq-postgres
            context: ./apps/nuq-postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/nishantr2/${{ matrix.image }}:latest
            ghcr.io/nishantr2/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
